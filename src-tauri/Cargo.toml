[package]
name = "notex"
version = "0.1.0"
description = "NoteX 可执行笔记"
edition = "2021"
rust-version = "1.77"

[lib]
name = "notex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 删除笔记进系统废纸篓，而不是直接 unlink
trash = "5"
# 校验下载的运行时包
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
